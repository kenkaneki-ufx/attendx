<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#4F46E5"/>
  
  <!-- QR Code Pattern -->
  <g fill="#FFFFFF">
    <!-- Top-left finder -->
    <rect x="12" y="12" width="16" height="16" rx="2"/>
    <rect x="14" y="14" width="12" height="12" rx="1" fill="#4F46E5"/>
    <rect x="16" y="16" width="8" height="8" rx="1" fill="#FFFFFF"/>
    
    <!-- Top-right finder -->
    <rect x="36" y="12" width="16" height="16" rx="2"/>
    <rect x="38" y="14" width="12" height="12" rx="1" fill="#4F46E5"/>
    <rect x="40" y="16" width="8" height="8" rx="1" fill="#FFFFFF"/>
    
    <!-- Bottom-left finder -->
    <rect x="12" y="36" width="16" height="16" rx="2"/>
    <rect x="14" y="38" width="12" height="12" rx="1" fill="#4F46E5"/>
    <rect x="16" y="40" width="8" height="8" rx="1" fill="#FFFFFF"/>
    
    <!-- Center pattern -->
    <rect x="32" y="32" width="4" height="4"/>
    <rect x="38" y="32" width="4" height="4"/>
    <rect x="44" y="32" width="4" height="4"/>
    <rect x="32" y="38" width="4" height="4"/>
    <rect x="44" y="38" width="4" height="4"/>
    <rect x="32" y="44" width="4" height="4"/>
    <rect x="38" y="44" width="4" height="4"/>
    
    <!-- Connecting dots -->
    <rect x="32" y="16" width="2" height="2"/>
    <rect x="36" y="20" width="2" height="2"/>
    <rect x="16" y="32" width="2" height="2"/>
    <rect x="20" y="36" width="2" height="2"/>
  </g>
  
  <!-- Checkmark overlay -->
  <g transform="translate(32, 32)">
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <path d="M-5,0 L-2,3 L5,-4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
