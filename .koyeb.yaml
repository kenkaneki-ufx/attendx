# Koyeb Service Configuration for AttendX
# This file helps Koyeb understand your project structure

services:
  - name: attendx
    dockerfile: Dockerfile
    instance_type: nano  # Free tier (512MB RAM, 0.1 vCPU)
    ports:
      - port: 8000
        protocol: http
    healthcheck:
      path: /admin/
      port: 8000
    env:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
    scaling:
      min: 1
      max: 1
    routes:
      - path: /
        service: attendx