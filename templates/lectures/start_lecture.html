{% extends 'base.html' %}

{% block title %}Start Lecture - AttendX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-play-circle me-2"></i> Start New Lecture
                </h5>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="subject_id" class="form-label">Subject</label>
                            <select name="subject_id" id="subject_id" class="form-select" required>
                                <option value="">Select a subject...</option>
                                {% for assignment in assignments %}
                                <option value="{{ assignment.subject.pk }}">
                                    {{ assignment.subject.code }} - {{ assignment.subject.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="section_id" class="form-label">Section</label>
                            <select name="section_id" id="section_id" class="form-select" required>
                                <option value="">Select a section...</option>
                                {% for assignment in assignments %}
                                <option value="{{ assignment.section.pk }}">
                                    {{ assignment.section.name }} (Sem {{ assignment.section.semester }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="lecture_number" class="form-label">Lecture Period</label>
                            <select name="lecture_number" id="lecture_number" class="form-select">
                                <option value="1">1st Period</option>
                                <option value="2">2nd Period</option>
                                <option value="3">3rd Period</option>
                                <option value="4">4th Period</option>
                                <option value="5">5th Period</option>
                                <option value="6">6th Period</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="duration_minutes" class="form-label">Duration (minutes)</label>
                            <select name="duration_minutes" id="duration_minutes" class="form-select">
                                <option value="30">30 minutes</option>
                                <option value="45">45 minutes</option>
                                <option value="60" selected>60 minutes</option>
                                <option value="90">90 minutes</option>
                                <option value="120">120 minutes</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'dashboard:faculty_dashboard' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-play me-2"></i> Start Lecture
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
