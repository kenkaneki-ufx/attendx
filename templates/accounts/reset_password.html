{% extends 'base.html' %}

{% block title %}Reset Password - AttendX{% endblock %}

{% block auth_content %}
<div class="text-center mb-4">
    <i class="fas fa-key fa-3x text-primary mb-3"></i>
    <h2>Reset Password</h2>
    <p class="text-muted">Enter your new password</p>
</div>

<form method="post" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label for="id_new_password" class="form-label">New Password</label>
        <input type="password" name="new_password" id="id_new_password"
               class="form-control" placeholder="Enter new password" minlength="8" required>
    </div>

    <div class="mb-3">
        <label for="id_confirm_password" class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" id="id_confirm_password"
               class="form-control" placeholder="Confirm new password" required>
    </div>

    <button type="submit" class="btn btn-primary w-100 mb-3">
        <i class="fas fa-save me-2"></i> Reset Password
    </button>
</form>

<div class="text-center">
    <a href="{% url 'accounts:login' %}" class="text-decoration-none">
        <i class="fas fa-arrow-left me-1"></i> Back to Login
    </a>
</div>
{% endblock %}
