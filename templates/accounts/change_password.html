{% extends 'base.html' %}

{% block title %}Change Password - AttendX{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-key me-2"></i> Change Password
                </h5>
            </div>
            <div class="card-body">
                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_old_password" class="form-label">Current Password</label>
                        <input type="password" name="old_password" id="id_old_password"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="id_new_password" class="form-label">New Password</label>
                        <input type="password" name="new_password" id="id_new_password"
                               class="form-control" minlength="8" required>
                        <small class="text-muted">Minimum 8 characters</small>
                    </div>

                    <div class="mb-3">
                        <label for="id_confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="id_confirm_password"
                               class="form-control" required>
                    </div>

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        {% for error in form.errors %}
                            <p class="mb-0">{{ error }}</p>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-1"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
