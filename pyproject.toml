[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "attendx"
version = "1.0.0"
description = "QR Code-based Attendance Management System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "Django>=5.2,<6.0",
    "dj-database-url>=2.1.0",
    "psycopg2-binary>=2.9.9",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.2.0",
    "whitenoise>=6.5.0",
    "gunicorn>=21.2.0",
    "python-dotenv>=1.0.0",
]
